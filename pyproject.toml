[project]
name = "bus-factor-cerebro"
version = "0.1.0"
description = "P2 — Cerebro IA de Bus Factor HQ: extraccion de conocimiento, riesgo, simulacion y quests"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerebro", "backend"]
